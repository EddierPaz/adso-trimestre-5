<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio: Login - Bootstrap</title>
    
    <!-- Favicon del portafolio -->
    <link rel="icon" type="image/png" href="../../../../assets/img/profile/logo.png">

    <!-- FontAwesome (Iconos del menú) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS del Nav Compartido -->
    <link rel="stylesheet" href="../../../../assets/css/portafolio_nav.css">
    
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS local del ejercicio -->
    <link rel="stylesheet" href="../css/estilos1.css">

    <style>
        /* Ajuste para evitar que el nav fijo cubra el contenido */
        body {
            padding-top: 80px; 
        }
    </style>
</head>

<body class="bg-info">

    <!-- ============ NAV COMPARTIDO ============ -->
    <nav class="portfolio-nav">
        <div class="pnav-left">
            <a href="../../../../index.html" class="pnav-logo" aria-label="Inicio">
                <div class="pnav-logo-avatar">
                    <img src="../../../../assets/img/profile/logo.png" alt="Logo">
                </div>
            </a>
            <!-- Botón para volver a la galería -->
            <a href="../index.html" class="pnav-back" aria-label="Volver a la galería">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Galería</span>
            </a>
        </div>

        <div class="pnav-center">
            Ejercicio: Login
        </div>

        <div class="pnav-actions">
            <button id="pnav-dark-toggle" class="pnav-icon-btn" aria-label="Cambiar tema oscuro/claro">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="../../../../index.html#juego" class="pnav-game-btn" aria-label="Abrir modo universo">
                <span class="pnav-game-icon">🎮</span>
                <span class="pnav-game-text">Modo Juego</span>
            </a>
        </div>
    </nav>

    <!-- ============ CONTENIDO DEL EJERCICIO ============ -->
    
    <!-- Contenedor principal flexbox para centrar vertical y horizontalmente -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row w-100">
            <!-- Tarjeta del formulario (4 columnas en desktop) -->
            <div class="col-md-4 offset-md-4 p-4 border rounded bg-white shadow">
                
                <!-- Imagen de usuario (Círculo con borde) -->
                <div class="text-center">
                    <img src="../img/ejemplo-3.jpg" class="rounded-circle border border-secondary p-1" alt="Usuario" style="width: 100px; height: 100px; object-fit: cover;">
                </div>
                
                <h2 class="text-center text-primary mt-3">Iniciar Sesión</h2>
                
                <!-- Formulario de inicio de sesión -->
                <form class="mt-3">
                    <div class="mb-3">
                        <label class="form-label text-dark">Usuario</label>
                        <input type="text" class="form-control border border-secondary" placeholder="Ingresa tu usuario">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-dark">Contraseña</label>
                        <input type="password" class="form-control border border-secondary" placeholder="Ingresa tu contraseña">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </div>
                </form>
                
                <!-- Enlace a registro -->
                <div class="text-center mt-3">
                    <p class="text-muted">¿No tienes cuenta? <a href="#" class="text-primary">Regístrate</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ SCRIPTS ============ -->
    <script src="../../../../assets/js/portafolio_nav.js"></script>
    
    <!-- Bootstrap JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
