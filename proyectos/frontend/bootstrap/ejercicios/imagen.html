<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio: Imágenes - Bootstrap</title>
    
    <!-- Favicon del portafolio -->
    <link rel="icon" type="image/png" href="../../../../assets/img/profile/logo.png">

    <!-- FontAwesome (Iconos del menú) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS del Nav Compartido -->
    <link rel="stylesheet" href="../../../../assets/css/portafolio_nav.css">
    
    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS local del ejercicio -->
    <link rel="stylesheet" href="../css/estilos1.css">

    <style>
        /* Ajuste para evitar que el nav fijo cubra el contenido */
        body {
            padding-top: 80px; 
        }
    </style>
</head>

<body>

    <!-- ============ NAV COMPARTIDO ============ -->
    <nav class="portfolio-nav">
        <div class="pnav-left">
            <a href="../../../../index.html" class="pnav-logo" aria-label="Inicio">
                <div class="pnav-logo-avatar">
                    <img src="../../../../assets/img/profile/logo.png" alt="Logo">
                </div>
            </a>
            <!-- Botón para volver a la galería -->
            <a href="../index.html" class="pnav-back" aria-label="Volver a la galería">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Galería</span>
            </a>
        </div>

        <div class="pnav-center">
            Ejercicio: Imágenes
        </div>

        <div class="pnav-actions">
            <button id="pnav-dark-toggle" class="pnav-icon-btn" aria-label="Cambiar tema oscuro/claro">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="../../../../index.html#juego" class="pnav-game-btn" aria-label="Abrir modo universo">
                <span class="pnav-game-icon">🎮</span>
                <span class="pnav-game-text">Modo Juego</span>
            </a>
        </div>
    </nav>

    <!-- ============ CONTENIDO DEL EJERCICIO ============ -->
    
    <!-- Contenedor principal Bootstrap centrado con margen superior -->
    <div class="container mt-4 mb-5">

        <!-- Título centrado horizontalmente -->
        <h1 class="text-center mb-4">Ejemplo de Imágenes con Bootstrap</h1>

        <!-- ===== PRIMERA FILA ===== -->
        <div class="row">

            <!-- Columna con fondo rojo (bg-danger), ancho completo en móvil, 1/3 en tablet+ -->
            <div class="col-12 col-md-4 bg-danger p-3">
                <!-- img-fluid: imagen responsive. rounded: bordes redondeados -->
                <img src="../img/ejemplo-2.jpg" alt="Imagen 1" class="img-fluid rounded">
                <p class="text-center mt-2">.img-fluid .rounded</p>
            </div>

            <!-- Columna con fondo gris (bg-secondary) -->
            <div class="col-12 col-md-4 bg-secondary p-3">
                <!-- rounded-circle: convierte la imagen en un círculo perfecto -->
                <img src="../img/ejemplo-2.jpg" alt="Imagen 2" class="img-fluid rounded-circle">
                <p class="text-center mt-2">.rounded-circle</p>
            </div>

            <!-- Columna con fondo verde (bg-success) -->
            <div class="col-12 col-md-4 bg-success p-3">
                <!-- rounded-0: elimina cualquier borde redondeado -->
                <img src="../img/ejemplo-2.jpg" alt="Imagen 3" class="img-fluid rounded-0">
                <p class="text-center mt-2">.img-fluid .rounded-0</p>
            </div>

        </div>

        <!-- ===== SEGUNDA FILA con margen superior (mt-4) ===== -->
        <div class="row mt-4">

            <!-- Columna con fondo oscuro (bg-dark) -->
            <div class="col-12 col-md-4 bg-dark p-3">
                <!-- img-thumbnail: añade un borde, padding y fondo blanco alrededor de la imagen -->
                <img src="../img/ejemplo-2.jpg" alt="Imagen 4" class="img-thumbnail">
                <p class="text-center text-white mt-2">.img-thumbnail</p>
            </div>

            <!-- Columna con fondo celeste (bg-info) -->
            <div class="col-12 col-md-4 bg-info p-3">
                <!-- float-end: flota la imagen hacia la derecha dentro de su contenedor -->
                <img src="../img/ejemplo-2.jpg" alt="Imagen 5" class="float-end">
                <p class="text-center mt-2">.float-end</p>
            </div>

            <!-- Columna con fondo amarillo (bg-warning) -->
            <div class="col-12 col-md-4 bg-warning p-3">
                <!-- mx-auto: centra horizontalmente. d-block: necesario para que mx-auto funcione -->
                <img src="../img/ejemplo-2.jpg" alt="Imagen 6" class="mx-auto d-block">
                <p class="text-center mt-2">.mx-auto .d-block</p>
            </div>

        </div>

        <!-- ===== TERCERA FILA con margen superior (mt-4) ===== -->
        <div class="row mt-4">

            <!-- Columna con fondo gris (bg-secondary) -->
            <div class="col-12 col-md-4 bg-secondary p-3">
                <!-- my-auto: centra verticalmente. d-inline: muestra la imagen en línea -->
                <img src="../img/ejemplo-2.jpg" alt="Imagen 7" class="my-auto d-inline">
                <p class="text-center mt-2">.my-auto .d-inline</p>
            </div>

            <!-- Columna con fondo azul (bg-primary) -->
            <div class="col-12 col-md-4 bg-primary p-3">
                <!-- d-inline-block: bloque en línea. mx-auto: centra horizontalmente -->
                <img src="../img/ejemplo-2.jpg" alt="Imagen 8" class="d-inline-block mx-auto">
                <p class="text-center mt-2">.d-inline-block .mx-auto</p>
            </div>

            <!-- Columna con fondo celeste (bg-info) -->
            <div class="col-12 col-md-4 bg-info p-3">
                <!-- float-start: flota a la izquierda. rounded-end: redondea el lado derecho -->
                <img src="../img/ejemplo-2.jpg" alt="Imagen 9" class="float-start rounded-end">
                <p class="text-center mt-2">.float-start</p>
            </div>

        </div>

    </div>

    <!-- ============ SCRIPTS ============ -->
    <script src="../../../../assets/js/portafolio_nav.js"></script>
    
    <!-- Bootstrap JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
